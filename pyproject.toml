[project]
name = "merlin"
version = "0.2.0"
description = "A granular home automation platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "aiomqtt>=2.5.1",
    "aiosqlite>=0.20.0",
    "geopy>=2.4.1",
    "pysqlite3>=0.5.2",
]

[project.scripts]
merlin = "merlin.main:main"
